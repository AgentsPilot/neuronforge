# Business OS LLM Attribution Type Check + Model-Literal Check + Test Suite
# The job name `Type check (Business OS LLM attribution)` is a REQUIRED status
# check on `main`: a red run here blocks the merge, for all three gates below.
# Workflow and job NAMES are kept stable on purpose - branch protection
# requires the check by name, so renaming it silently drops the requirement.
#
# The call catalog (lib/business-os/llm/callCatalog.ts) turns a wrong area or
# call name, or a missing account, into a TYPE error. Nothing else enforces
# types: next.config.js ignores build errors, Jest is transpile-only, and the
# repo carries pre-existing tsc errors. This job fails only on NEW type errors
# in the attribution scope (see scripts/typecheck-bos-llm.ts for how the scope
# is derived and how the committed baseline works).
#
# A second step runs the Layer 2 literal gate
# (scripts/check-bos-llm-literals.ts): no Business OS call site may hardcode a
# model name or a temperature instead of resolving it (FR-15).
#
# A third step runs `npm run test:bos-llm` (lib/business-os/llm/__tests__):
# the boundary snapshots that record exactly what each call site sends to the
# provider. Placed in this job, not its own, so it is required from day one and
# shares the install; its runtime was measured against `next build`'s time -
# see docs/workplans/BOS_LLM_TESTS_IN_CI_WORKPLAN.md.
#
# No `paths:` filter on purpose: the scope is derived from the import graph
# (the catalog, its importers, barrels, and their direct callers), so a new
# file anywhere that starts using the catalog or an attributed service is
# covered automatically. The job does skip its own work for a change confined
# to docs/, root-level *.md, scripts/ or .claude/ - see the scope step, which
# carves scripts/typecheck-bos-llm.ts and its baseline back out precisely
# because they ARE this gate.

name: Business OS LLM Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: the job only checks out and type-checks.
permissions:
  contents: read

# A newer push to the same branch supersedes a running check.
concurrency:
  group: bos-llm-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-bos-llm:
    name: Type check (Business OS LLM attribution)
    runs-on: ubuntu-latest
    # The three gates take about a minute after install; fail fast if something hangs.
    timeout-minutes: 15
    steps:
      # fetch-depth 2 so HEAD^ resolves. On a merge landing on main HEAD^ is
      # the previous main tip; on a pull_request (refs/pull/N/merge) HEAD^1 is
      # the base tip. Either way HEAD^..HEAD is the whole change under review.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Nothing in the type scope can be reached from docs/, scripts/ or
      # .claude/ - except this gate's own source, which the rule excludes.
      #
      # This is NOT a `paths:` filter. The job still runs on every PR and
      # always reports a conclusion, so it stays safe to make a required
      # status check - a `paths:` filter would leave the check pending
      # forever and block the merge. The rule itself lives in
      # .github/ci/non-deploying-change.sh (shared with vercel.json's
      # ignoreCommand) and fails open: anything it cannot classify builds.
      - name: Can this change affect attribution types?
        id: scope
        env:
          # Measure the WHOLE push, not just its last commit. At fetch-depth 2
          # this sha resolves only when it IS HEAD^ - a single commit, which is
          # what a squash or merge landing on main looks like. A bigger push
          # (rebase-merge, merge queue batch, direct multi-commit push) cannot
          # resolve it, and the script fails open to BUILD. Empty on
          # pull_request, where the script's HEAD^ default is already the base
          # tip of the merge ref.
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if bash .github/ci/non-deploying-change.sh "$BASE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Node major from .nvmrc, as build.yml does: the production major. The
      # test step below exercises route code that uses the global `crypto`,
      # which Node 18 does not provide - on '18' it failed for a runtime that
      # production does not run.
      - name: Setup Node.js
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - name: Run scoped type check
        if: steps.scope.outputs.skip != 'true'
        env:
          # The program covers the whole repo so types resolve as in the editor.
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: npm run typecheck:bos-llm

      # Layer 2 (FR-15): no Business OS call site may write its own model name
      # or temperature - it must resolve them, so an operator can change a model
      # or switch an area off without a deploy. A re-hardcoded call site still
      # works and still passes every attribution test; it just stops obeying its
      # area row, and nobody finds out until an operator changes a setting and
      # nothing happens. Same scope derivation as the step above
      # (scripts/lib/bos-llm-scope.ts), no compile, ~20s.
      #
      # `!cancelled()` so a red type check cannot hide a literal regression:
      # both verdicts appear in one run, and the job fails if either fails.
      # (`always()` would also run after a cancel.) The skip condition is
      # repeated because the step now runs even when an earlier one failed.
      - name: Run model/temperature literal check
        if: ${{ !cancelled() && steps.scope.outputs.skip != 'true' }}
        run: npm run check:bos-llm-literals

      # The proof behind the BOS LLM standards: the boundary snapshots record
      # exactly what each call site sends to the provider. Nothing ran them, so
      # #151 moved the chat planner prompt, its snapshot went red, and main stayed
      # red until #185. `--ci` (in the npm script) makes a stale, new, obsolete or
      # orphaned snapshot FAIL instead of being written; the orphan scan is
      # repo-wide. No --passWithNoTests: a moved test folder must fail loudly.
      # Same `!cancelled()` reasoning as the literal check above. Its runtime
      # was measured against `next build` before it was placed here: see
      # docs/workplans/BOS_LLM_TESTS_IN_CI_WORKPLAN.md. Re-measure before
      # widening the test list.
      - name: Run Business OS LLM test suite
        if: ${{ !cancelled() && steps.scope.outputs.skip != 'true' }}
        run: npm run test:bos-llm

      - name: Note the skip in the run summary
        if: steps.scope.outputs.skip == 'true'
        run: |
          echo "Skipped: every changed file is documentation, scripts or" >> "$GITHUB_STEP_SUMMARY"
          echo "Claude Code config, so it cannot reach an environment." >> "$GITHUB_STEP_SUMMARY"
          echo "Rule: .github/ci/non-deploying-change.sh" >> "$GITHUB_STEP_SUMMARY"
