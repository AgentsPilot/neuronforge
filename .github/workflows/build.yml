# Production Build Gate
#
# `next build` is the only gate that catches a whole class of breakage in this
# repo: next.config.js sets typescript.ignoreBuildErrors and
# eslint.ignoreDuringBuilds, and the repo carries thousands of pre-existing tsc
# errors, so a full type check cannot be the gate. The build still fails on
# module-scope crashes and missing modules during "Collecting page data" /
# "Generating static pages" - which is exactly how a break reached main once
# (PR #53).
#
# Deliberately a separate workflow from bos-llm-typecheck.yml:
#   - branch protection requires check NAMES, so build and typecheck should be
#     requireable independently and attribute their own failures;
#   - this job needs placeholder service env (below) that the typecheck has no
#     business holding;
#   - the two have different runtimes, and running them as separate workflows
#     costs no extra wall clock (they run in parallel).
#
# No `paths:` filter on purpose: almost any file in the repo can break the
# build. The one exception is handled INSIDE the job (see the scope step): a
# change confined to docs/, root-level *.md, scripts/ or .claude/ cannot alter
# what `next build` compiles, because nothing under app/ or lib/ imports
# scripts/ and the rule deliberately refuses nested markdown - V6 reads its
# system prompts from lib/agentkit/v6/**/prompts/*.md at runtime.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: the job checks out and builds. It publishes nothing.
permissions:
  contents: read

# A newer push to the same branch supersedes a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    # 3-7 min locally for 295 pages, cold. Generous headroom, but fail rather
    # than hang.
    timeout-minutes: 30
    steps:
      # fetch-depth 2 so HEAD^ resolves. On a merge landing on main HEAD^ is
      # the previous main tip; on a pull_request (refs/pull/N/merge) HEAD^1 is
      # the base tip. Either way HEAD^..HEAD is the whole change under review.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A documentation-only change cannot break `next build`, and a cold
      # build of 295 pages is the most expensive job in this repo.
      #
      # This is NOT a `paths:` filter. The job still runs on every PR and
      # always reports a conclusion, so it stays safe to make a required
      # status check - a `paths:` filter would leave the check pending
      # forever and block the merge. The rule itself lives in
      # .github/ci/non-deploying-change.sh (shared with vercel.json's
      # ignoreCommand) and fails open: anything it cannot classify builds.
      - name: Can this change affect the build?
        id: scope
        env:
          # Measure the WHOLE push, not just its last commit. At fetch-depth 2
          # this sha resolves only when it IS HEAD^ - a single commit, which is
          # what a squash or merge landing on main looks like. A bigger push
          # (rebase-merge, merge queue batch, direct multi-commit push) cannot
          # resolve it, and the script fails open to BUILD. Empty on
          # pull_request, where the script's HEAD^ default is already the base
          # tip of the merge ref.
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if bash .github/ci/non-deploying-change.sh "$BASE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Node major comes from .nvmrc so CI, local nvm users and the Vercel
      # project setting have one number to keep in step. It is pinned to the
      # major Vercel builds this project with - NOT to the '18' the other two
      # workflows still use, because a build gate that runs on a different
      # major than production can be green while the deploy breaks. Vercel
      # dropped Node 18 support in Sept 2025, and package.json's
      # engines ">=18.17.0" is a floor, not a pin, so Vercel falls back to the
      # project default (22.x). Confirm in Project Settings > Node.js Version
      # if that ever changes, and update .nvmrc here.
      - name: Setup Node.js
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      # No .next/cache step on purpose. The build output for 295 pages is
      # hundreds of MB, and any key that actually tracks source would miss on
      # every PR and re-save every run - churning through the repo-wide 10 GB
      # LRU budget and evicting the npm caches the other two workflows rely on.
      # A cold build is a fine price for a gate, and it is the build least
      # able to hide a break behind reused artifacts.
      #
      # next build evaluates route modules, and several construct their service
      # clients at module scope (Supabase admin, OpenAI, Stripe, QStash), so
      # those vars must be PRESENT or the build dies collecting page data.
      # Some routes also fetch during page-data collection: the log shows real
      # `TypeError: fetch failed` against the placeholder host from
      # /api/admin/onboarding-config and /api/admin/token-usage/stats, which
      # stay green only because they catch and log it. So placeholders must
      # point somewhere that can never resolve - hence the RFC-2606 `.invalid`
      # TLD rather than a subdomain of a real provider domain.
      #
      # NEVER put real credentials here. This file is public. If the build ever
      # starts needing a real value, that is a bug in the code being built (a
      # module doing real I/O at import time), not a reason to add a secret.
      - name: Build
        if: steps.scope.outputs.skip != 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-not-a-real-key'
          SUPABASE_URL: 'https://ci.invalid'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-not-a-real-key'
          OPENAI_API_KEY: 'ci-not-a-real-key'
          STRIPE_SECRET_KEY: 'sk_test_ci-not-a-real-key'
          QSTASH_TOKEN: 'ci-not-a-real-key'
          QSTASH_CURRENT_SIGNING_KEY: 'sig_ci_not_a_real_key'
          QSTASH_NEXT_SIGNING_KEY: 'sig_ci_not_a_real_key'
        # No `|| true`, no continue-on-error: next build exits non-zero on a
        # build error and that must fail the job.
        #
        # The one exception is retried below, and ONLY that one.
        #
        # `next/font/google` downloads the three build-time faces (Heebo in
        # app/layout.tsx, Space Grotesk + Inter in app/business-os/layout.tsx)
        # from Google during the build. Google answers 200 with valid CSS, but
        # intermittently gives the font file a URL with no file extension - the
        # `fonts.gstatic.com/l/font?kit=...` form rather than the usual
        # `/s/heebo/v26/<hash>.woff2`. next/font 14.2 indexes the extension
        # match with no null guard:
        #
        #   node_modules/next/dist/compiled/@next/font/dist/google/loader.js:112
        #   const ext = /\.(woff|woff2|eot|ttf|otf)$/.exec(googleFontFileUrl)[1]
        #
        # so the build dies with `TypeError: Cannot read properties of null
        # (reading '1')`. Google varies that URL form per edge, which is why
        # the SAME commit builds green on one run and red on the next. It has
        # already reddened main (run 35639481653, the #87 merge, 2026-09-21)
        # and PR #90 the next morning. next/font retries twice internally -
        # fetch-css-from-google-fonts.js AND fetch-font-file.js - and the crash
        # is downstream of BOTH, so neither ever fires. 14.2.35 is the last
        # 14.2.x as of 2026-09-22, so there is no patch to upgrade into.
        #
        # This retry is INSURANCE, NOT THE FIX. It cannot help Vercel, which
        # runs the same build and makes the same call, so a production deploy
        # can still fail on this. Accept with open eyes that this weakens the
        # correspondence this file's header defends: a green gate no longer
        # quite implies a clean deploy of the same commit. Self-hosting the
        # three faces through `next/font/local` is what removes the network
        # call for good, and it is why Step 1 has an expiry - see
        # docs/workplans/NEXT_FONT_BUILD_FLAKE_WORKPLAN.md.
        #
        # Retry only on that one signature. Any other failure exits
        # immediately, so a genuine build break still fails once, at full
        # speed, and this can never turn a real error green. In particular
        # every next/font MISCONFIGURATION (unknown family, unknown weight,
        # unknown subset, bad display value) is thrown as a NextFontError and
        # renders as "`next/font` error:", which deliberately does NOT match -
        # only the unknown-throw branch does. `Failed to fetch font` is also a
        # NextFontError and is also not retried on purpose: that one is the
        # honest signal that the network is down.
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"

          for attempt in 1 2 3; do
            # `tee`, never `tee -a`: each attempt must be judged on its OWN
            # log. Appending would let a genuine compile error on attempt 2
            # match attempt 1's stale font signature, retry, and be reported
            # as the font flake.
            #
            # `timeout` because a next build that HANGS (a stalled font socket
            # rather than a crash) would otherwise eat the job's whole 30-min
            # budget and report nothing useful.
            #
            # 480s, and the arithmetic is the constraint: timeout-minutes: 30
            # bounds the WHOLE job, so 3 attempts must fit inside it alongside
            # the prelude (checkout + npm ci measured 35s and 105s on the two
            # failed runs). 3 x 480 + 2 x 10 = 24m20s, which fits; 3 x 900
            # would be 45m20s and GitHub would cancel the job before the step
            # could print ANY of its own annotations - losing exactly the
            # diagnostics the timeout exists to preserve. 480s is still ~2.5x
            # the slowest of the 30 most recent Build runs (1m27s-3m31s).
            #
            # `-k 30` because plain `timeout` signals only the direct child
            # (npm). next build runs beneath it and holds the pipe's write end,
            # so without the follow-up SIGKILL `tee` can block past the timeout
            # and the 124 branch never runs.
            #
            # Captured via `|| status=$?`, not `$?` after an `if`: an `if`
            # whose condition fails and which has no `else` returns 0, so the
            # status would be lost. Spelled as a full `if` rather than
            # `[ ... ] && exit 0`, which is a set -e footgun.
            status=0
            timeout -k 30 480 npm run build 2>&1 | tee "$log" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -eq 124 ]; then
              echo "::error::next build hung and was killed after 8 minutes. Not retrying: a hang is not the font flake, and three of them would blow the job's 30-minute budget."
              exit 1
            fi

            # All THREE strings, not just the first. "An error occurred in
            # next/font" is the catch-all for ANY non-NextFontError throw, and
            # the loader frame only narrows that to "something threw somewhere
            # inside google/loader.js" - an ENOSPC at loader.js:200 would still
            # match both. The null-dereference text is what actually identifies
            # THIS bug, and it is present in the real crash log. Without it the
            # step retries an unrelated failure three times and then reports it
            # as the Google URL flake - and the runbook in the workplan tells
            # the reader to redeploy and not debug, so the misdiagnosis turns
            # into wrong action.
            if ! { grep -qF 'An error occurred in `next/font`' "$log" \
                && grep -qF '@next/font/dist/google/loader.js' "$log" \
                && grep -qF 'Cannot read properties of null' "$log"; }; then
              echo "::error::next build failed for a reason other than the known next/font flake. Not retrying."
              exit 1
            fi

            # `|| true` because an unset GITHUB_STEP_SUMMARY would otherwise
            # abort the whole step under set -e, turning a retryable flake into
            # a hard failure with no annotation at all. Actions always sets it;
            # this is belt and braces on the one line that would swallow the
            # diagnostics if it did not.
            #
            # The summary line is the instrument for measuring how often this
            # actually fires, so it must count real retries: on attempt 3 there
            # is no retry left, and announcing one there would inflate the rate
            # by 50% and waste a 10s sleep before the loop exits anyway.
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::next/font hit the known Google URL crash (attempt ${attempt}/3). Retrying."
              echo "- Attempt ${attempt}/3 hit the next/font Google URL flake." >> "$GITHUB_STEP_SUMMARY" || true
              sleep 10
            fi
          done

          echo "::error::next build hit the same next/font null-dereference on all 3 attempts. Every edge this runner reached served the unparseable URL form; treat it as a real outage rather than a flake."
          exit 1

      - name: Note the skip in the run summary
        if: steps.scope.outputs.skip == 'true'
        run: |
          echo "Skipped: every changed file is documentation, scripts or" >> "$GITHUB_STEP_SUMMARY"
          echo "Claude Code config, so it cannot reach an environment." >> "$GITHUB_STEP_SUMMARY"
          echo "Rule: .github/ci/non-deploying-change.sh" >> "$GITHUB_STEP_SUMMARY"
